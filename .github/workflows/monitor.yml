name: Мониторинг отзывов LUDUS

on:
  # Запуск только извне: cron-job.org пунктуально дёргает workflow_dispatch 5×/день
  # (09/12/15/18/20 по Пхукету). GitHub-расписание НЕ используем — экономим Apify.
  workflow_dispatch: {}

permissions:
  contents: write          # чтобы коммитить обновлённую базу отзывов

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Собрать отзывы и уведомить
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_MAPS_URL: ${{ secrets.GOOGLE_MAPS_URL }}
          TRIPADVISOR_URLS: ${{ secrets.TRIPADVISOR_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/сбор.py

      - name: Построить дашборд
        run: python3 tools/дашборд.py

      - name: Сохранить базу и дашборд
        run: |
          git config user.name "ludus-reviews-bot"
          git config user.email "bot@ludus.local"
          git add данные docs
          git commit -m "reviews state + dashboard $(date -u +%FT%TZ)" || echo "нет изменений"
          git push
